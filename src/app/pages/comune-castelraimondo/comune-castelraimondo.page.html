<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="kiosk-toolbar-back" fill="clear" (click)="goBack()" aria-label="Torna indietro">
        <ion-icon slot="icon-only" ios="chevron-back-outline" md="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Comune di Castelraimondo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <!-- Browser/PWA -->
  <iframe
    *ngIf="isBrowser"
    [src]="safeUrl"
    class="ext-frame"
    sandbox="allow-scripts allow-same-origin allow-forms"
    referrerpolicy="no-referrer"
    allow="geolocation 'none'; microphone 'none'; camera 'none'; payment 'none'"
    title="Comune di Castelraimondo"
  ></iframe>

  <!-- App mobile -->
  <p *ngIf="!isBrowser" style="padding:16px">
    Caricamento sito istituzionale...
  </p>
</ion-content>
