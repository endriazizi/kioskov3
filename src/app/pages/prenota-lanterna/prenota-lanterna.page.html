<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="kiosk-toolbar-back" fill="clear" (click)="goBack()" aria-label="Torna indietro">
        <ion-icon slot="icon-only" ios="chevron-back-outline" md="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Prenota La Lanterna</ion-title>
    <ion-buttons slot="end">
      <ion-button
        class="premium-plans-cta"
        fill="solid"
        color="warning"
        (click)="openPremiumPlans()"
        aria-label="Apri piani premium"
      >
        <ion-icon slot="start" name="pricetags-outline"></ion-icon>
        Piani Premium
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="pl-page">
  <!-- Browser/PWA: iframe SANDBOX per bloccare uscite (popup/top-navigation) -->
  <iframe
    *ngIf="isBrowser"
    class="ext-frame"
    [src]="safeUrl"
    sandbox="allow-scripts allow-same-origin allow-forms"
    referrerpolicy="no-referrer"
    allow="geolocation 'none'; microphone 'none'; camera 'none'; payment 'none'"
    title="Prenota Pizzeria La Lanterna"
  ></iframe>

  <!-- App mobile: placeholder/loader; qui puoi aprire un in-app browser se vuoi -->
  <p *ngIf="!isBrowser" class="loading-msg">
    Caricamento Prenota La Lanterna...
  </p>
</ion-content>
