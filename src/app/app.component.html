<ion-app appKioskWhitelist [class.ion-palette-dark]="dark">
  @if (kioskLoading.loading()) {
  <div class="kiosk-api-loading-overlay" aria-busy="true" role="status">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
  }
  <ion-split-pane contentId="main-content">
    <ion-menu menuId="main-menu" contentId="main-content">
      <ion-content>
        <ion-list lines="none">
          <ion-list-header> Conference </ion-list-header>
          @for(p of appPages; track p.url; let i = $index) {
          <ion-menu-toggle autoHide="false">
            <ion-item
              [routerLink]="p.url"
              routerLinkActive="selected"
              routerDirection="root"
              detail="false"
            >
              <ion-icon
                slot="start"
                [name]="p.icon?.endsWith('-outline') ? p.icon : (p.icon + '-outline')"
              ></ion-icon>
              <ion-label>
                {{ p.title }}
              </ion-label>
            </ion-item>
          </ion-menu-toggle>
          }
        </ion-list>
